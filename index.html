<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AI Parfum Groq Free</title>
</head>

<body style="font-family:Arial;padding:20px">

<h2>🤖 AI Parfum Indonesia (Powered by Groq FREE)</h2>

<textarea id="input" rows="8" cols="50"
placeholder="Masukkan formula parfum...
Contoh:
Vanilla 3ml
Mango 2ml
Citrus 5ml"></textarea>

<br><br>

<button onclick="runAI()">🔬 Analisis AI</button>

<pre id="hasil" style="margin-top:20px;background:#f4f4f4;padding:10px;"></pre>

<script>

// =========================
// GROQ AI FUNCTION
// =========================
async function runAI(){

    let text = document.getElementById("input").value;

    document.getElementById("hasil").innerText = "⏳ AI sedang menganalisis...";

    try {

        let res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer MASUKKAN_API_KEY_GROQ_KAMU"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    {
                        role: "system",
                        content: "Kamu adalah master perfumer dan marketing parfum di Indonesia. Jawab seperti ahli parfum profesional."
                    },
                    {
                        role: "user",
                        content: `
Analisis parfum berikut:

${text}

Berikan:
1. Karakter aroma
2. Kesan parfum (premium / luxury / sporty / murah / sexy)
3. Target market Indonesia
4. Saran formula perbaikan
5. Nama brand parfum yang cocok dijual
6. Estimasi ketahanan (jam)
7. Cocok untuk cuaca tropis Indonesia atau tidak
8. Saran harga jual di Indonesia
                        `
                    }
                ]
            })
        });

        let data = await res.json();

        let result = data.choices[0].message.content;

        document.getElementById("hasil").innerText = result;

    } catch (error) {
        document.getElementById("hasil").innerText =
        "❌ Error: cek API key atau koneksi internet";
    }
}

</script>

</body>
</html>
